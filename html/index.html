<!DOCTYPE html>
<html lang="en" data-theme="neon-magenta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBCore HUD - Container</title>
    
    <!-- Neon Design-DNA Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Container Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', 'Roboto', sans-serif;
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Module Container Positioning */
        .module-container {
            position: absolute;
            pointer-events: auto;
        }
        
        /* HUD Core positioning (bottom-left) */
        .hud-core-container {
            bottom: 20px;
            left: 20px;
        }
        
        /* GPS Navigation positioning (bottom-right) */
        .gps-navigation-container {
            bottom: 20px;
            right: 20px;
        }
        
        /* Settings Menu positioning (center) */
        .hud-settings-container {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Navigation Menu positioning (center-left) */
        .nav-menu-container {
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
        }
        
        /* Module iframes */
        .module-iframe {
            border: none;
            background: transparent;
            width: 100%;
            height: 100%;
        }
        
        /* Hidden by default */
        .hidden {
            display: none !important;
        }
        
        /* Debug overlay (only in debug mode) */
        .debug-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0ff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Roboto', monospace;
            font-size: 12px;
            z-index: 9999;
            display: none;
        }
        
        .debug-overlay.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="container" id="hud-container">
        
        <!-- HUD Core Module Container (Status-Balken) -->
        <div class="module-container hud-core-container" id="hud-core-container">
            <iframe class="module-iframe" 
                    id="hud-core-iframe" 
                    src="hud-core.html"
                    scrolling="no">
            </iframe>
        </div>
        
        <!-- GPS Navigation Module Container -->
        <div class="module-container gps-navigation-container" id="gps-navigation-container">
            <iframe class="module-iframe" 
                    id="gps-navigation-iframe" 
                    src="gps-hud.html"
                    scrolling="no">  
            </iframe>
        </div>
        
        <!-- Settings Menu Module Container -->
        <div class="module-container hud-settings-container hidden" id="hud-settings-container">
            <iframe class="module-iframe" 
                    id="hud-settings-iframe" 
                    src="hud-settings.html"
                    scrolling="no">
            </iframe>
        </div>
        
        <!-- Navigation Menu Module Container -->
        <div class="module-container nav-menu-container hidden" id="nav-menu-container">
            <iframe class="module-iframe" 
                    id="nav-menu-iframe" 
                    src="nav-menu.html"
                    scrolling="no">
            </iframe>
        </div>
        
    </div>
    
    <!-- Debug Overlay (only shown in debug mode) -->
    <div class="debug-overlay" id="debug-overlay">
        <div class="debug-title">🔧 HUD DEBUG</div>
        <div class="debug-info">
            <div>Theme: <span id="debug-theme">neon-magenta</span></div>
            <div>Active Modules: <span id="debug-modules">0</span></div>
            <div>FPS: <span id="debug-fps">--</span></div>
            <div>Performance: <span id="debug-performance">OK</span></div>
        </div>
    </div>
    
    <!-- Container JavaScript -->
    <script>
        // Container Management System
        class HUDContainer {
            constructor() {
                this.modules = new Map();
                this.debugMode = false;
                this.currentTheme = 'neon-magenta';
                this.scaling = 1.0;
                this.opacity = 0.9;
                
                this.init();
            }
            
            init() {
                console.log('🚀 HUD Container initialized');
                
                // Register modules
                this.registerModule('hud_core', document.getElementById('hud-core-container'));
                this.registerModule('gps_navigation', document.getElementById('gps-navigation-container'));
                this.registerModule('hud_settings', document.getElementById('hud-settings-container'));
                this.registerModule('nav_menu', document.getElementById('nav-menu-container'));
                
                // Setup message listeners
                this.setupMessageListeners();
                
                // Setup debug mode
                this.setupDebugMode();
            }
            
            registerModule(name, container) {
                if (!container) {
                    console.warn(`Module container not found: ${name}`);
                    return;
                }
                
                this.modules.set(name, {
                    name: name,
                    container: container,
                    iframe: container.querySelector('.module-iframe'),
                    visible: !container.classList.contains('hidden'),
                    initialized: false
                });
                
                console.log(`📦 Module registered: ${name}`);
            }
            
            setupMessageListeners() {
                // Listen for messages from FiveM
                window.addEventListener('message', (event) => {
                    const { module, action, data } = event.data;
                    
                    if (module && this.modules.has(module)) {
                        this.handleModuleMessage(module, action, data);
                    } else {
                        // Global container messages
                        this.handleContainerMessage(event.data);
                    }
                });
                
                // Listen for messages from module iframes
                this.modules.forEach((moduleData, moduleName) => {
                    if (moduleData.iframe && moduleData.iframe.contentWindow) {
                        moduleData.iframe.contentWindow.addEventListener('message', (event) => {
                            // Forward module messages to FiveM
                            if (event.data.action && event.data.action.startsWith(moduleName + ':')) {
                                this.sendToFiveM(event.data);
                            }
                        });
                    }
                });
            }
            
            handleModuleMessage(module, action, data) {
                const moduleData = this.modules.get(module);
                if (!moduleData) return;
                
                switch (action) {
                    case 'setVisible':
                        this.setModuleVisible(module, data.visible);
                        break;
                    case 'setTheme':
                        this.setModuleTheme(module, data.theme);
                        break;
                    case 'setPosition':
                        this.setModulePosition(module, data.position);
                        break;
                    default:
                        // Forward to module iframe
                        this.sendToModule(module, action, data);
                        break;
                }
            }
            
            handleContainerMessage(data) {
                switch (data.action) {
                    case 'setTheme':
                        this.setGlobalTheme(data.theme);
                        break;
                    case 'setScaling':
                        this.setGlobalScaling(data.scaling);
                        break;
                    case 'setOpacity':
                        this.setGlobalOpacity(data.opacity);
                        break;
                    case 'toggleDebug':
                        this.toggleDebugMode();
                        break;
                    case 'hideAll':
                        this.hideAllModules();
                        break;
                    case 'showAll':
                        this.showAllModules();
                        break;
                }
            }
            
            setModuleVisible(moduleName, visible) {
                const moduleData = this.modules.get(moduleName);
                if (!moduleData) return;
                
                if (visible) {
                    moduleData.container.classList.remove('hidden');
                } else {
                    moduleData.container.classList.add('hidden');
                }
                
                moduleData.visible = visible;
                
                this.updateDebugInfo();
                console.log(`👁️ Module ${moduleName} visibility: ${visible}`);
            }
            
            setModuleTheme(moduleName, theme) {
                this.sendToModule(moduleName, 'setTheme', { theme: theme });
            }
            
            setGlobalTheme(theme) {
                this.currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                
                // Apply to all modules
                this.modules.forEach((moduleData, moduleName) => {
                    this.setModuleTheme(moduleName, theme);
                });
                
                this.updateDebugInfo();
                console.log(`🎨 Global theme changed to: ${theme}`);
            }
            
            setGlobalScaling(scaling) {
                this.scaling = scaling;
                
                const container = document.getElementById('hud-container');
                container.style.transform = `scale(${scaling})`;
                container.style.transformOrigin = 'center center';
                
                console.log(`📏 Global scaling set to: ${scaling}`);
            }
            
            setGlobalOpacity(opacity) {
                this.opacity = opacity;
                
                const container = document.getElementById('hud-container');
                container.style.opacity = opacity;
                
                console.log(`👁️ Global opacity set to: ${opacity}`);
            }
            
            sendToModule(moduleName, action, data) {
                const moduleData = this.modules.get(moduleName);
                if (!moduleData || !moduleData.iframe || !moduleData.iframe.contentWindow) return;
                
                moduleData.iframe.contentWindow.postMessage({
                    action: action,
                    data: data
                }, '*');
            }
            
            sendToFiveM(data) {
                // Send message back to FiveM
                fetch(`https://${GetParentResourceName ? GetParentResourceName() : 'qb-hud'}/${data.action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data.data || {})
                }).catch(() => {
                    // Ignore fetch errors in development
                });
            }
            
            hideAllModules() {
                this.modules.forEach((moduleData, moduleName) => {
                    this.setModuleVisible(moduleName, false);
                });
            }
            
            showAllModules() {
                this.modules.forEach((moduleData, moduleName) => {
                    this.setModuleVisible(moduleName, true);
                });
            }
            
            setupDebugMode() {
                // Check for debug mode from URL or message
                if (window.location.search.includes('debug=true')) {
                    this.toggleDebugMode();
                }
            }
            
            toggleDebugMode() {
                this.debugMode = !this.debugMode;
                
                const debugOverlay = document.getElementById('debug-overlay');
                if (this.debugMode) {
                    debugOverlay.classList.add('active');
                    this.startDebugMonitoring();
                } else {
                    debugOverlay.classList.remove('active');
                    this.stopDebugMonitoring();
                }
                
                console.log(`🔧 Debug mode: ${this.debugMode ? 'ON' : 'OFF'}`);
            }
            
            startDebugMonitoring() {
                this.debugInterval = setInterval(() => {
                    this.updateDebugInfo();
                }, 1000);
            }
            
            stopDebugMonitoring() {
                if (this.debugInterval) {
                    clearInterval(this.debugInterval);
                    this.debugInterval = null;
                }
            }
            
            updateDebugInfo() {
                if (!this.debugMode) return;
                
                const activeModules = Array.from(this.modules.values())
                    .filter(m => m.visible).length;
                
                document.getElementById('debug-theme').textContent = this.currentTheme;
                document.getElementById('debug-modules').textContent = activeModules;
                document.getElementById('debug-fps').textContent = this.getFPS();
                document.getElementById('debug-performance').textContent = this.getPerformanceStatus();
            }
            
            getFPS() {
                // Simple FPS approximation
                return Math.floor(60 / (this.modules.size || 1)) + ' FPS';
            }
            
            getPerformanceStatus() {
                const activeModules = Array.from(this.modules.values())
                    .filter(m => m.visible).length;
                
                if (activeModules <= 2) return 'EXCELLENT';
                if (activeModules <= 3) return 'GOOD';
                if (activeModules <= 4) return 'OK';
                return 'HEAVY';
            }
        }
        
        // Initialize HUD Container when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.hudContainer = new HUDContainer();
        });
        
        // Fallback for immediate script execution
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                if (!window.hudContainer) {
                    window.hudContainer = new HUDContainer();
                }
            });
        } else {
            window.hudContainer = new HUDContainer();
        }
    </script>
</body>
</html>
