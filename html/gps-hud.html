<!DOCTYPE html>
<html lang="en" data-theme="neon-magenta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Navigation HUD</title>
    
    <!-- Neon Design-DNA Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* Neon Design-DNA Farben */
            --primary: #B026FF;     /* Magenta */
            --secondary: #0ff;      /* Cyan */
            --accent: #FFD700;      /* Gold */
            --bg-dark: #1a1a1a;
            --bg-darker: #111;
            --text-primary: #fff;
            --text-secondary: #e0e0e0;
            
            /* Navigation Farben */
            --waypoint-color: #ff6b35;
            --route-color: #4ecdc4;
            --compass-color: #45b7d1;
            --location-color: #96ceb4;
            
            /* Animationen */
            --transition: all 0.3s ease;
            --glow: 0 0 15px rgba(176, 38, 255, 0.4);
            --glow-strong: 0 0 25px rgba(176, 38, 255, 0.8);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', 'Roboto', sans-serif;
            background: transparent;
            color: var(--text-primary);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        
        /* Main Container */
        .gps-navigation-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        
        /* Navigation Info Panel */
        .nav-panel {
            background: linear-gradient(145deg, rgba(30, 30, 30, 0.9), rgba(10, 10, 10, 0.9));
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 12px;
            min-width: 280px;
            backdrop-filter: blur(10px);
            box-shadow: var(--glow);
            transition: var(--transition);
            pointer-events: auto;
        }
        
        .nav-panel:hover {
            transform: translateX(-5px) scale(1.02);
            box-shadow: var(--glow-strong);
        }
        
        /* Location Display */
        .location-panel {
            text-align: center;
        }
        
        .location-zone {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--location-color);
            margin-bottom: 4px;
        }
        
        .location-street {
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.8;
        }
        
        /* Compass Display */
        .compass-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .compass-direction {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .compass-icon {
            font-size: 20px;
            color: var(--compass-color);
            animation: compassSpin 8s linear infinite;
        }
        
        .compass-text {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--compass-color);
            letter-spacing: 1px;
        }
        
        .compass-degrees {
            font-family: 'Roboto', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        /* Speed Display */
        .speed-panel {
            text-align: center;
            padding: 8px;
            background: linear-gradient(145deg, rgba(69, 183, 209, 0.2), rgba(10, 10, 10, 0.5));
            border: 1px solid var(--compass-color);
            border-radius: 8px;
        }
        
        .speed-value {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            font-weight: 900;
            color: var(--compass-color);
            letter-spacing: 1px;
        }
        
        .speed-unit {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.8;
        }
        
        /* Waypoint Panel */
        .waypoint-panel {
            background: linear-gradient(145deg, rgba(255, 107, 53, 0.2), rgba(10, 10, 10, 0.9));
            border-color: var(--waypoint-color);
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.4);
        }
        
        .waypoint-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .waypoint-icon {
            font-size: 18px;
            color: var(--waypoint-color);
        }
        
        .waypoint-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--waypoint-color);
            flex: 1;
        }
        
        .waypoint-distance {
            font-family: 'Roboto', monospace;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .waypoint-eta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.8;
        }
        
        /* Route Panel */
        .route-panel {
            background: linear-gradient(145deg, rgba(78, 205, 196, 0.2), rgba(10, 10, 10, 0.9));
            border-color: var(--route-color);
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.4);
        }
        
        .route-step {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        
        .route-step-icon {
            font-size: 14px;
            color: var(--route-color);
            min-width: 16px;
        }
        
        .route-step-instruction {
            font-size: 12px;
            color: var(--text-secondary);
            flex: 1;
        }
        
        .route-step-distance {
            font-size: 11px;
            color: var(--route-color);
            opacity: 0.7;
        }
        
        /* Minimap Controls */
        .minimap-controls {
            display: flex;
            gap: 8px;
        }
        
        .minimap-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(5px);
        }
        
        .minimap-btn:hover {
            background: rgba(176, 38, 255, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.5);
        }
        
        .minimap-btn.active {
            background: var(--primary);
            color: var(--bg-darker);
            box-shadow: var(--glow);
        }
        
        /* Animations */
        @keyframes compassSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes waypointPulse {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(255, 107, 53, 0.4);
                border-color: var(--waypoint-color);
            }
            50% { 
                box-shadow: 0 0 25px rgba(255, 107, 53, 0.8);
                border-color: #ff8c65;
            }
        }
        
        .waypoint-panel.active {
            animation: waypointPulse 2s infinite;
        }
        
        @keyframes scanLine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .nav-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(176, 38, 255, 0.2), 
                transparent
            );
            animation: scanLine 6s infinite;
            pointer-events: none;
        }
        
        /* Hidden State */
        .hidden {
            display: none !important;
        }
        
        /* Themes */
        [data-theme="neon-cyan"] {
            --primary: #0ff;
            --glow: 0 0 15px rgba(0, 255, 255, 0.4);
            --glow-strong: 0 0 25px rgba(0, 255, 255, 0.8);
        }
        
        [data-theme="classic"] {
            --primary: #ffffff;
            --secondary: #cccccc;
            --accent: #ffff00;
            --glow: 0 0 15px rgba(255, 255, 255, 0.4);
            --glow-strong: 0 0 25px rgba(255, 255, 255, 0.8);
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .gps-navigation-container {
                top: 10px;
                right: 10px;
            }
            
            .nav-panel {
                min-width: 240px;
                padding: 10px;
            }
            
            .location-zone {
                font-size: 14px;
            }
            
            .compass-text {
                font-size: 16px;
            }
            
            .speed-value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="gps-navigation-container" id="gps-navigation">
        
        <!-- Current Location Panel -->
        <div class="nav-panel location-panel" id="location-panel">
            <div class="location-zone" id="location-zone">VINEWOOD HILLS</div>
            <div class="location-street" id="location-street">Elgin Avenue / Power Street</div>
        </div>
        
        <!-- Compass & Speed Panel -->
        <div class="nav-panel compass-panel" id="compass-panel">
            <div class="compass-direction">
                <i class="compass-icon fas fa-compass" id="compass-icon"></i>
                <div>
                    <div class="compass-text" id="compass-direction">N</div>
                    <div class="compass-degrees" id="compass-degrees">0°</div>
                </div>
            </div>
            <div class="speed-panel">
                <div class="speed-value" id="speed-value">0</div>
                <div class="speed-unit" id="speed-unit">MPH</div>
            </div>
        </div>
        
        <!-- Active Waypoint Panel -->
        <div class="nav-panel waypoint-panel hidden" id="waypoint-panel">
            <div class="waypoint-info">
                <i class="waypoint-icon fas fa-map-marker-alt"></i>
                <div class="waypoint-name" id="waypoint-name">Destination</div>
                <div class="waypoint-distance" id="waypoint-distance">0.0 km</div>
            </div>
            <div class="waypoint-eta">
                <i class="fas fa-clock"></i>
                <span id="waypoint-eta">ETA: --:--</span>
            </div>
        </div>
        
        <!-- Active Route Panel -->
        <div class="nav-panel route-panel hidden" id="route-panel">
            <div class="route-step">
                <i class="route-step-icon fas fa-arrow-right"></i>
                <div class="route-step-instruction" id="route-instruction">Head to destination</div>
                <div class="route-step-distance" id="route-step-distance">0.0 km</div>
            </div>
        </div>
        
        <!-- Minimap Controls -->
        <div class="nav-panel">
            <div class="minimap-controls">
                <button class="minimap-btn" id="minimap-shape-btn">
                    <i class="fas fa-square"></i> Square
                </button>
                <button class="minimap-btn" id="minimap-zoom-in">
                    <i class="fas fa-plus"></i>
                </button>
                <button class="minimap-btn" id="minimap-zoom-out">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>
        
    </div>
    
    <script>
        // GPS Navigation Manager
        class GPSNavigationManager {
            constructor() {
                this.data = {
                    location: {
                        name: "Unknown",
                        street: "Unknown Street"
                    },
                    compass: {
                        heading: 0,
                        direction: "N",
                        speed: 0
                    },
                    waypoint: {
                        active: false,
                        name: "Destination",
                        distance: 0,
                        eta: 0
                    },
                    route: {
                        active: false,
                        instruction: "Head to destination",
                        distance: 0
                    },
                    minimap: {
                        shape: 'square',
                        zoom: 0
                    }
                };
                
                this.elements = {
                    locationZone: document.getElementById('location-zone'),
                    locationStreet: document.getElementById('location-street'),
                    
                    compassIcon: document.getElementById('compass-icon'),
                    compassDirection: document.getElementById('compass-direction'),
                    compassDegrees: document.getElementById('compass-degrees'),
                    speedValue: document.getElementById('speed-value'),
                    speedUnit: document.getElementById('speed-unit'),
                    
                    waypointPanel: document.getElementById('waypoint-panel'),
                    waypointName: document.getElementById('waypoint-name'),
                    waypointDistance: document.getElementById('waypoint-distance'),
                    waypointEta: document.getElementById('waypoint-eta'),
                    
                    routePanel: document.getElementById('route-panel'),
                    routeInstruction: document.getElementById('route-instruction'),
                    routeStepDistance: document.getElementById('route-step-distance'),
                    
                    minimapShapeBtn: document.getElementById('minimap-shape-btn'),
                    minimapZoomIn: document.getElementById('minimap-zoom-in'),
                    minimapZoomOut: document.getElementById('minimap-zoom-out')
                };
                
                this.init();
            }
            
            init() {
                console.log('🗺️ GPS Navigation Manager initialized');
                
                // Setup click handlers
                this.setupClickHandlers();
                
                // Setup message listener
                this.setupMessageListener();
                
                // Initial render
                this.render();
            }
            
            setupClickHandlers() {
                // Minimap shape toggle
                this.elements.minimapShapeBtn.addEventListener('click', () => {
                    this.toggleMinimapShape();
                });
                
                // Zoom controls
                this.elements.minimapZoomIn.addEventListener('click', () => {
                    this.adjustZoom(1);
                });
                
                this.elements.minimapZoomOut.addEventListener('click', () => {
                    this.adjustZoom(-1);
                });
                
                // Clear waypoint on waypoint panel click
                this.elements.waypointPanel.addEventListener('click', () => {
                    this.clearWaypoint();
                });
            }
            
            setupMessageListener() {
                window.addEventListener('message', (event) => {
                    const { action, data } = event.data;
                    
                    switch (action) {
                        case 'locationUpdate':
                            this.updateLocation(data);
                            break;
                        case 'compassUpdate':
                            this.updateCompass(data);
                            break;
                        case 'waypointSet':
                            this.setWaypoint(data);
                            break;
                        case 'waypointCleared':
                            this.clearWaypoint();
                            break;
                        case 'routeStarted':
                            this.startRoute(data);
                            break;
                        case 'routeCleared':
                            this.clearRoute();
                            break;
                        case 'minimapShapeChanged':
                            this.updateMinimapShape(data.shape);
                            break;
                        case 'setVisible':
                            this.setVisible(data.visible);
                            break;
                        case 'setTheme':
                            this.setTheme(data.theme);
                            break;
                    }
                });
            }
            
            updateLocation(data) {
                if (!data) return;
                
                this.data.location = data;
                this.elements.locationZone.textContent = data.name.toUpperCase();
                this.elements.locationStreet.textContent = data.street;
            }
            
            updateCompass(data) {
                if (!data) return;
                
                this.data.compass = data;
                
                // Update compass direction
                this.elements.compassDirection.textContent = data.direction;
                this.elements.compassDegrees.textContent = `${data.heading}°`;
                
                // Rotate compass icon
                this.elements.compassIcon.style.transform = `rotate(${data.heading}deg)`;
                
                // Update speed
                this.elements.speedValue.textContent = Math.floor(data.speed);
                
                // Update speed unit based on value
                if (data.speed > 200) {
                    this.elements.speedUnit.textContent = 'MPH'; // Likely aircraft
                } else {
                    this.elements.speedUnit.textContent = 'MPH'; // Ground vehicle
                }
            }
            
            setWaypoint(data) {
                if (!data) return;
                
                this.data.waypoint = Object.assign(this.data.waypoint, data);
                this.data.waypoint.active = true;
                
                // Show waypoint panel
                this.elements.waypointPanel.classList.remove('hidden');
                this.elements.waypointPanel.classList.add('active');
                
                // Update waypoint info
                this.elements.waypointName.textContent = data.name || 'Waypoint';
                
                this.updateWaypointDistance();
            }
            
            updateWaypointDistance() {
                if (!this.data.waypoint.active) return;
                
                const distance = this.data.waypoint.distance || 0;
                const eta = this.data.waypoint.eta || 0;
                
                // Format distance
                if (distance < 1000) {
                    this.elements.waypointDistance.textContent = `${Math.floor(distance)}m`;
                } else {
                    this.elements.waypointDistance.textContent = `${(distance / 1000).toFixed(1)}km`;
                }
                
                // Format ETA
                if (eta > 0) {
                    const minutes = Math.floor(eta / 60);
                    const seconds = Math.floor(eta % 60);
                    this.elements.waypointEta.textContent = `ETA: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                } else {
                    this.elements.waypointEta.textContent = 'ETA: --:--';
                }
            }
            
            clearWaypoint() {
                this.data.waypoint.active = false;
                
                // Hide waypoint panel
                this.elements.waypointPanel.classList.add('hidden');
                this.elements.waypointPanel.classList.remove('active');
                
                // Send to FiveM
                this.sendToFiveM('gpsnav:clearWaypoint', {});
            }
            
            startRoute(data) {
                if (!data) return;
                
                this.data.route = Object.assign(this.data.route, data);
                this.data.route.active = true;
                
                // Show route panel
                this.elements.routePanel.classList.remove('hidden');
                
                // Update route info
                if (data.steps && data.steps.length > 0) {
                    const currentStep = data.steps[0];
                    this.elements.routeInstruction.textContent = currentStep.instruction || 'Follow route';
                    this.elements.routeStepDistance.textContent = `${(currentStep.distance / 1000).toFixed(1)}km`;
                }
            }
            
            clearRoute() {
                this.data.route.active = false;
                
                // Hide route panel
                this.elements.routePanel.classList.add('hidden');
            }
            
            toggleMinimapShape() {
                const newShape = this.data.minimap.shape === 'square' ? 'circle' : 'square';
                this.updateMinimapShape(newShape);
                
                // Send to FiveM
                this.sendToFiveM('gpsnav:toggleMinimapShape', { shape: newShape });
            }
            
            updateMinimapShape(shape) {
                this.data.minimap.shape = shape;
                
                // Update button text and icon
                if (shape === 'circle') {
                    this.elements.minimapShapeBtn.innerHTML = '<i class="fas fa-circle"></i> Circle';
                } else {
                    this.elements.minimapShapeBtn.innerHTML = '<i class="fas fa-square"></i> Square';
                }
            }
            
            adjustZoom(direction) {
                const newZoom = Math.max(0, Math.min(200, this.data.minimap.zoom + (direction * 20)));
                this.data.minimap.zoom = newZoom;
                
                // Send to FiveM
                this.sendToFiveM('gpsnav:setMinimapZoom', { zoom: newZoom });
            }
            
            setVisible(visible) {
                const container = document.getElementById('gps-navigation');
                if (visible) {
                    container.classList.remove('hidden');
                } else {
                    container.classList.add('hidden');
                }
            }
            
            setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
            
            sendToFiveM(action, data) {
                fetch(`https://${this.getResourceName()}/${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data || {})
                }).catch(() => {
                    // Ignore fetch errors in development
                });
            }
            
            getResourceName() {
                return window.GetParentResourceName ? GetParentResourceName() : 'qb-hud';
            }
            
            render() {
                this.updateLocation(this.data.location);
                this.updateCompass(this.data.compass);
                this.updateMinimapShape(this.data.minimap.shape);
                
                console.log('🗺️ GPS Navigation rendered');
            }
        }
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.gpsNavigationManager = new GPSNavigationManager();
        });
        
        // Fallback for immediate execution
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                if (!window.gpsNavigationManager) {
                    window.gpsNavigationManager = new GPSNavigationManager();
                }
            });
        } else {
            window.gpsNavigationManager = new GPSNavigationManager();
        }
    </script>
</body>
</html>
