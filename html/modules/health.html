<!-- ================================================================
     QBCore HUD - Health Module Template
     Version: 3.0.0
     Description: Health, Armor, Hunger, Thirst, Stress, Oxygen bars
     ================================================================ -->

<div class="health-module module" id="module-health" data-position="bottom-left">
    <div class="module-content">
        <div class="scan-line"></div>
        
        <!-- Status Bars Container -->
        <div class="status-bars">
            
            <!-- Health Bar -->
            <div class="status-bar health-bar" id="health-container">
                <div class="status-icon">
                    <i class="fas fa-heart status-health"></i>
                </div>
                <div class="status-progress">
                    <div class="progress-bg"></div>
                    <div class="progress-fill health-fill" id="health-fill" style="width: 100%;"></div>
                </div>
                <div class="progress-text" id="health-text">100</div>
            </div>

            <!-- Armor Bar -->
            <div class="status-bar armor-bar hidden" id="armor-container">
                <div class="status-icon">
                    <i class="fas fa-shield-alt status-armor"></i>
                </div>
                <div class="status-progress">
                    <div class="progress-bg"></div>
                    <div class="progress-fill armor-fill" id="armor-fill" style="width: 0%;"></div>
                </div>
                <div class="progress-text" id="armor-text">0</div>
            </div>

            <!-- Hunger Bar -->
            <div class="status-bar hunger-bar" id="hunger-container">
                <div class="status-icon">
                    <i class="fas fa-hamburger status-hunger"></i>
                </div>
                <div class="status-progress">
                    <div class="progress-bg"></div>
                    <div class="progress-fill hunger-fill" id="hunger-fill" style="width: 100%;"></div>
                </div>
                <div class="progress-text" id="hunger-text">100</div>
            </div>

            <!-- Thirst Bar -->
            <div class="status-bar thirst-bar" id="thirst-container">
                <div class="status-icon">
                    <i class="fas fa-tint status-thirst"></i>
                </div>
                <div class="status-progress">
                    <div class="progress-bg"></div>
                    <div class="progress-fill thirst-fill" id="thirst-fill" style="width: 100%;"></div>
                </div>
                <div class="progress-text" id="thirst-text">100</div>
            </div>

            <!-- Stress Bar -->
            <div class="status-bar stress-bar hidden" id="stress-container">
                <div class="status-icon">
                    <i class="fas fa-brain status-stress"></i>
                </div>
                <div class="status-progress">
                    <div class="progress-bg"></div>
                    <div class="progress-fill stress-fill" id="stress-fill" style="width: 0%;"></div>
                </div>
                <div class="progress-text" id="stress-text">0</div>
            </div>

            <!-- Oxygen Bar -->
            <div class="status-bar oxygen-bar hidden" id="oxygen-container">
                <div class="status-icon">
                    <i class="fas fa-lungs status-oxygen"></i>
                </div>
                <div class="status-progress">
                    <div class="progress-bg"></div>
                    <div class="progress-fill oxygen-fill" id="oxygen-fill" style="width: 100%;"></div>
                </div>
                <div class="progress-text" id="oxygen-text">100</div>
            </div>

        </div>
    </div>
</div>

<!-- Money Display (separate component) -->
<div class="money-module module" id="module-money" data-position="top-right-secondary">
    <div class="module-content">
        
        <!-- Cash Display -->
        <div class="money-display hidden" id="money-cash">
            <div class="money-symbol">$</div>
            <div class="money-amount" id="cash-amount">0</div>
        </div>

        <!-- Bank Display -->
        <div class="money-display hidden" id="money-bank">
            <div class="money-symbol">🏦</div>
            <div class="money-amount" id="bank-amount">0</div>
        </div>

        <!-- Money Change Display -->
        <div class="money-change hidden" id="money-change">
            <div class="change-symbol positive" id="change-symbol">+</div>
            <div class="change-amount" id="change-amount">0</div>
        </div>

    </div>
</div>

<style>
/* ================================================================
   HEALTH MODULE SPECIFIC STYLES
   ================================================================ */

.health-module .module-content {
    background: linear-gradient(145deg, var(--bg-darker), var(--bg-dark));
    border: 2px solid transparent;
    border-radius: var(--border-radius);
    padding: 8px 12px;
    backdrop-filter: var(--backdrop-blur);
    min-width: 220px;
    position: relative;
    overflow: hidden;
}

.health-module:hover .module-content {
    border-color: var(--primary);
    box-shadow: var(--glow-primary);
    transform: translateY(var(--hover-translate)) scale(var(--hover-scale));
}

/* Status Bars Container */
.status-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

/* Individual Status Bar */
.status-bar {
    display: flex;
    align-items: center;
    min-height: 28px;
    padding: 4px 0;
    position: relative;
    transition: all var(--transition-speed) ease;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.3);
    overflow: hidden;
}

.status-bar.hidden {
    opacity: 0;
    transform: scaleY(0);
    margin: 0;
    min-height: 0;
    padding: 0;
}

.status-bar.visible {
    opacity: 1;
    transform: scaleY(1);
}

/* Status Icon */
.status-bar .status-icon {
    margin-right: 10px;
    font-size: 16px;
    min-width: 20px;
    text-align: center;
    z-index: 2;
    position: relative;
}

.status-bar .status-icon i {
    filter: drop-shadow(0 0 6px currentColor);
}

/* Progress Bar */
.status-progress {
    flex: 1;
    position: relative;
    height: 12px;
    border-radius: 6px;
    overflow: hidden;
    margin-right: 10px;
    background: rgba(0, 0, 0, 0.6);
}

.progress-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    border-radius: 6px;
}

.progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    border-radius: 6px;
    transition: width var(--transition-speed) ease;
    z-index: 1;
    position: relative;
}

.progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    animation: scan 2s linear infinite;
}

/* Progress Text */
.progress-text {
    font-size: 11px;
    font-weight: bold;
    min-width: 30px;
    text-align: right;
    z-index: 2;
    position: relative;
    color: var(--text-primary);
    text-shadow: 0 0 5px var(--primary);
}

/* Health-specific Fill Colors */
.health-fill { 
    background: linear-gradient(90deg, var(--status-health), #ff6666);
    box-shadow: 0 0 8px var(--status-health);
}

.armor-fill { 
    background: linear-gradient(90deg, var(--status-armor), #33d4e6);
    box-shadow: 0 0 8px var(--status-armor);
}

.hunger-fill { 
    background: linear-gradient(90deg, var(--status-hunger), #ffc466);
    box-shadow: 0 0 8px var(--status-hunger);
}

.thirst-fill { 
    background: linear-gradient(90deg, var(--status-thirst), #42c3f7);
    box-shadow: 0 0 8px var(--status-thirst);
}

.stress-fill { 
    background: linear-gradient(90deg, var(--status-stress), #b040ff);
    box-shadow: 0 0 8px var(--status-stress);
}

.oxygen-fill { 
    background: linear-gradient(90deg, var(--status-oxygen), #66d4f7);
    box-shadow: 0 0 8px var(--status-oxygen);
}

/* Critical States */
.status-bar.critical {
    border: 1px solid #ff0040;
    box-shadow: 0 0 15px rgba(255, 0, 64, 0.6);
    animation: pulse 1s infinite;
}

.status-bar.warning {
    border: 1px solid #ff9500;
    box-shadow: 0 0 10px rgba(255, 149, 0, 0.4);
}

.status-bar.normal {
    border: 1px solid transparent;
}

.status-bar.full {
    border: 1px solid #00ff41;
    box-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
}

/* Flash Effects */
.status-bar.flash-damage {
    animation: flashRed 0.5s ease;
}

.status-bar.flash-armor-break {
    animation: flashBlue 0.5s ease;
}

@keyframes flashRed {
    0%, 100% { background-color: rgba(0, 0, 0, 0.3); }
    50% { background-color: rgba(255, 0, 0, 0.5); }
}

@keyframes flashBlue {
    0%, 100% { background-color: rgba(0, 0, 0, 0.3); }
    50% { background-color: rgba(0, 100, 255, 0.5); }
}

/* ================================================================
   MONEY MODULE SPECIFIC STYLES
   ================================================================ */

.money-module .module-content {
    background: linear-gradient(145deg, var(--bg-darker), var(--bg-dark));
    border: 2px solid transparent;
    border-radius: var(--border-radius);
    padding: 6px 10px;
    backdrop-filter: var(--backdrop-blur);
    min-width: 140px;
}

.money-module:hover .module-content {
    border-color: var(--accent);
    box-shadow: var(--glow-accent);
}

.money-display {
    display: flex;
    align-items: center;
    padding: 4px 8px;
    margin: 2px 0;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 4px;
    border: 1px solid transparent;
    transition: all var(--transition-speed) ease;
}

.money-display:hover {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
}

.money-symbol {
    font-size: 14px;
    color: var(--accent);
    margin-right: 6px;
    font-weight: bold;
    text-shadow: 0 0 8px var(--accent);
}

.money-amount {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-primary);
    font-family: var(--font-primary);
    text-shadow: 0 0 5px var(--primary);
}

.money-change {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid var(--accent);
    border-radius: 6px;
    padding: 6px 10px;
    margin: 4px 0;
    box-shadow: var(--glow-accent);
    animation: fadeIn 0.5s ease;
}

.change-symbol {
    font-size: 12px;
    margin-right: 4px;
    font-weight: bold;
    font-family: var(--font-primary);
}

.change-symbol.positive { 
    color: #00ff41; 
    text-shadow: 0 0 8px #00ff41;
}

.change-symbol.negative { 
    color: #ff0040; 
    text-shadow: 0 0 8px #ff0040;
}

.change-amount {
    font-size: 12px;
    font-weight: bold;
    color: var(--text-primary);
    font-family: var(--font-primary);
    text-shadow: 0 0 5px var(--primary);
}

/* ================================================================
   RESPONSIVE DESIGN
   ================================================================ */

@media screen and (max-width: 767px) {
    .health-module .module-content {
        min-width: 180px;
        padding: 6px 8px;
    }
    
    .status-bar {
        min-height: 24px;
    }
    
    .status-bar .status-icon {
        font-size: 14px;
        margin-right: 8px;
    }
    
    .status-progress {
        height: 10px;
        margin-right: 8px;
    }
    
    .progress-text {
        font-size: 10px;
        min-width: 25px;
    }
    
    .money-module .module-content {
        min-width: 120px;
        padding: 4px 6px;
    }
    
    .money-display {
        padding: 3px 6px;
    }
    
    .money-symbol,
    .money-amount {
        font-size: 12px;
    }
}

/* ================================================================
   PERFORMANCE MODE
   ================================================================ */

.performance-mode .progress-fill::after,
.performance-mode .scan-line,
.performance-mode .status-bar.critical {
    animation: none;
}

.performance-mode .status-bar .status-icon i,
.performance-mode .progress-text,
.performance-mode .money-symbol,
.performance-mode .money-amount {
    text-shadow: 0 0 3px currentColor;
}
</style>
